                             #   dia mengambang antara p90 dan maksimum tanpa dasar.
                             #
                             #   JANGAN memilih angka ini dari tabel hasil. Hasilnya
                             #   non-monotonik ($40 -> $544.81, $50 -> $383.39, $60 -> $490.52),
                             #   dan dengan cuma 10-15 zona dilewati, satu pemenang besar
                             #   sudah menggeser segalanya. Selisih antar batas di rentang
                             #   ini adalah NOISE.
                             #   Justru KARENA hasilnya noise, pilih berdasarkan dimensi yang
                             #   BUKAN noise: risikonya. Batas lebih ketat menang.
                             #
                             #   Diukur (210 zona, rr2): tanpa batas $922.15 PF 2.22 maxDD
                             #   -9.4% | $40 -> $544.81 PF 2.03 maxDD -9.4%, 15 zona
                             #   dilewati. Membatasi TETAP memangkas hasil (~41%); itu efek
                             #   nyata dan monotonik. Yang noise adalah selisih antar level.
                             # (batas $20 diuji lebih dulu dan jauh lebih merusak:
                             #  net $922 -> $130, PF 2.22 -> 1.30, 39 dari 210 zona
                             #  dibuang. Zona H4 struktural lebih lebar: p90 $36.57,
                             #  maks $101.11.)
        max_setups_per_day: 2  # 2026-08-13 permintaan user: "1 hari maksimal 2 trade".
                             #   Dihitung per hari UTC, menghitung ORDER YANG DIPASANG
                             #   (bukan yang terisi) — sesuai "maksimal 2 kali set".
                             #   CATATAN JUJUR: pada H4 sleeve ini rata-rata ~17-20 order
                             #   per TAHUN (~0.05/hari), jadi batas ini praktis TIDAK
                             #   PERNAH aktif. Dia berguna sebagai pengaman kalau nanti
                             #   timeframe diturunkan atau aturan dilonggarkan.
        manager_poll_seconds: 30
        dry_run: false       # LIVE sejak 2026-08-13. Jalur order_send diuji langsung ke
                             #   broker sebelum dinyalakan (tiket uji 1964345492, dipasang
                             #   $300 di bawah pasar supaya mustahil terisi, lalu dibatalkan):
                             #   harga/SL/TP benar, expiry tersimpan server 06:24 = UTC 03:24
                             #   persis sesuai permintaan, cancel bersih, nol sisa.
                             #   Uji itu MENEMUKAN bug nyata: `expiration` sebagai objek
                             #   datetime ditolak MT5 ("Invalid expiration argument") dan
                             #   order_send mengembalikan None -> sleeve akan DIAM TOTAL
                             #   tanpa satu order pun, dan itu terlihat sama persis dengan
                             #   "belum ada sinyal". Harus int epoch. Lihat _place().

    # =================================================================================
    # SMC XAU H1 — ALIRAN KEDUA (magic 920644). Konfigurasi C: OB + BOS + liquidity
    # SWEEP (TANPA FVG). Dipasang 2026-08-13 untuk menjawab permintaan user menaikkan
    # frekuensi tanpa merugi.
    #
    # KENAPA INI, PADAHAL STANDALONE-NYA BIASA SAJA:
    #   H1-C sendirian: 249 trade, +$131.80, PF 1.10, maxDD -44.3%, 5/6 tahun hijau.
    #   Angka itu tidak istimewa. SELURUH nilainya ada di KORELASI NEGATIF-nya:
    #     vs ORB -0.24 | vs ETERNA -0.07 | vs SMC H4-B -0.12
    #   Dia rugi saat yang lain untung, dan untung saat yang lain rugi.
    #
    #   Efek ke buku (research/smc_dua_aliran.py):
    #     ORB+ETERNA             CAGR 43.3%  maxDD -25.0%  Calmar 1.73  Sharpe 1.03
    #     +H4B                   CAGR 47.4%  maxDD -24.2%  Calmar 1.95  Sharpe 1.14
    #     +H4B+H1C               CAGR 48.2%  maxDD -17.2%  Calmar 2.80  Sharpe 1.18
    #   DRAWDOWN TURUN dari -24.2% ke -17.2% justru saat menambah sleeve ber-maxDD -44%.
    #   Itu diversifikasi bekerja, bukan keberuntungan.
    #
    #   Frekuensi SMC: 96 -> 345 order (0.05 -> 0.17/hari, 3.6x) TANPA melonggarkan H4-B.
    #
    # CARA MENAIKKAN FREKUENSI YANG SUDAH DIUJI DAN DITOLAK (jangan diulang):
    #   MTF bias H4 + entry H1 : -$164 / -$101 / -$11 di expiry 12/24/48. RUGI semua.
    #   H4-B diturunkan ke H1  : -$128   | diturunkan ke M15 : -$397
    #   M15 D (paling sering, 0.23/hari): +$55 tapi net/DD 1.1 vs 42.5 milik H4-B.
    #   Kesimpulan: melonggarkan aturan SELALU merugi. Edge SMC ada di selektivitasnya.
    #
    # RISIKO YANG HARUS DISADARI: nilai slot ini BERGANTUNG pada korelasi negatif yang
    # diukur di 66 bulan (-0.12 dan -0.24 = lemah-sedang). Kalau korelasinya bergeser
    # ke positif, yang tersisa cuma sleeve dengan maxDD -44% dan profit tipis $132/5,5thn.
    # Ini risiko nyata, bukan formalitas.
    #
    # Total trial SMC sekarang 20 (16 awal + 3 MTF + 1 dua-aliran) -> ambang DSR NAIK.
    # =================================================================================
    - name: smc_xau_h1
      enabled: true
      type: smclimit
      symbol: XAUUSD
      lot: 0.01
      magic: 920644          # UNIK (920643 = smc_xau H4)
      params:
        timeframe: "1h"
        swing_k: 3
        ob_lookback: 10
        expiry_bars: 12      # 12 bar H1 = 12 jam
        rr: 2.0
        buffer_frac: 0.10
        use_fvg: false       # konfigurasi C: TANPA FVG
        use_sweep: true      # WAJIB: sweep-lah yang membedakan C. Tanpa itu H1-A = -$5.
        sweep_window: 5
        # --- KONFIRMASI ENTRY DI M5 (permintaan user 2026-08-13) -------------------
        # TIDAK ada pending limit di aliran ini. Alurnya: harga menyentuh zona OB ->
        # wajib ada BOS M5 searah dalam 12 bar M5 (60 menit) -> baru kirim MARKET.
        #
        # Diukur di research/smc_konfirmasi_m5.py (443 zona, exit diputus di bar M5):
        #   limit pasif        303 trade  +$1194  PF 1.92  WR 50%  maxDD -7.8%  net/DD 153
        #   konfirmasi 12 bar  215 trade  +$1280  PF 2.65  WR 68%  maxDD -4.4%  net/DD 291
        # Membaik di SETIAP dimensi: uang naik, PF naik, win rate 50%->68%,
        # drawdown hampir setengah.
        #
        # SENGAJA TIDAK dipasang di H4-B: di sana konfirmasi justru MERUSAK
        # (net/DD 98 -> 51, trade 99 -> 57). Zona H4 besar dan lambat; menunggu
        # konfirmasi berarti ketinggalan geraknya. Karena itu mode ini per-slot.
        entry_mode: "m5_confirm"
        konfirm_bars_m5: 12       # 12 bar M5 = 60 menit setelah zona tersentuh
        konfirm_max_umur_bar: 2   # konfirmasi >2 bar M5 yang lalu = harga basi, lewati
        history_bars: 30000  # ~500 bar H1
        # RISIKO SESUAI BALANCE (permintaan user 2026-08-14).
        # lot = (balance x risk_pct) / (jarak_SL x 100), dibulatkan ke bawah ke
        # kelipatan volume broker, dijepit ke [0.01, lot_maks].
        #
        # research/smc_sizing.py, equity di-compound dari $523 (215 trade):
        #   lot tetap 0.01 -> $1.803  CAGR 25.7%  maxDD -4.4%  Calmar 5.86
        #   risk 1%        -> $2.892  CAGR 37.1%  maxDD -4.4%  Calmar 8.43
        #   risk 2%        -> $16.842 CAGR 89.9%  maxDD -8.3%  Calmar 10.81  <- dipilih
        #   risk 3%        -> $39.220 CAGR 122%   maxDD -12.1% Calmar 10.12
        #
        # ⚠ ANGKA DI ATAS ADALAH ARAH, BUKAN RAMALAN. Itu proyeksi compounding dari
        # strategi ber-DSR 0.629 (belum lolos ambang 0.95); compounding melipatgandakan
        # edge DAN kesalahan estimasi. Model juga menganggap lot besar terisi sempurna,
        # padahal slippage tumbuh seiring ukuran. Karena itu lot_maks dijaga rendah.
        #
        # TIDAK ADA plafon yang MELEWATI trade - diuji dan merusak (plafon 3% di H4
        # membuang 26 dari 99 trade, Calmar 2.23 -> 0.24). Kalau lot minimum sudah
        # melewati target risiko, trade tetap DIAMBIL di 0.01.
        # Batas KERAS risiko per trade (permintaan user 2026-08-14). Zona ber-SL
        # lebih lebar dari ini DILEWATI, bukan dipaksa dengan SL dipersempit.
        # Diukur: PF 2.65 -> 2.86, maxDD -4.4% -> -4.6%, net $1280 -> $920, 34 zona
        # dilewati dari 443. Kualitas MEMBAIK, harganya $360 net dalam 5,5 tahun.
        # rr tetap 2.0: rr 3 -> PF 1.95, rr 5 (TP $100) -> PF 1.38 dan win rate
        # runtuh 69% -> 34%. TP $100 dengan SL $20 menuntut gerak 5x, terlalu jarang.
        sl_maks_usd: 20.0
        risk_pct: 0.02
        lot_maks: 0.05       # plafon konservatif; naikkan hanya kalau saldo DAN bukti
                             #   statistiknya sudah tumbuh, bukan salah satunya saja.
        contract_size: 100   # XAUUSD: 0.01 lot = $1 per $1 gerak
        max_setups_per_day: 2
        manager_poll_seconds: 30
        dry_run: false

    # vision_smc_xau: RETIRED 2026-07-01. LLM-as-decision-maker (entry gate via confidence)
    # is UNVERIFIABLE by construction (no reproducible historical signal series -> can't be
    # backtested), and in practice it just sat FLAT (conf 30-40 < gate 65) -> ~zero trades.
    # REPLACED by the SHADOW ADVISOR (see `advisor:` block below + pipeline/live/advisor.py):
    # LLM no longer DECIDES â€” it captures the chart + macro/micro context at each REAL brain
    # entry and logs a CONFIRM/CAUTION verdict ALONGSIDE the outcome, blocking nothing. After
    # 1-2 months we measure whether "caution" predicts losers -> only THEN earn the right to
    # let it filter. Honest forward-test, zero risk to the validated edge.

# =====================================================================================
# AGENT RR untuk sleeve SMC (pipeline/live/smc_rr.py) — 2026-08-13, permintaan user:
# "pakai agent juga untuk melihat RR nya untuk sl tp dan time exitnya".
#
# Dipanggil SINKRON oleh smc_limit_manager tepat sebelum order dikirim. Agent melihat
# chart + zona Order Block, mengecek kalender ekonomi lewat web_search, lalu boleh
# MENYESUAIKAN sl / tp / expiry_bars.
#
# RANCANGAN: agent adalah PENYESUAI, bukan penentu tunggal. Mesin selalu menghitung
# angka deterministik lebih dulu; agent menggesernya DI DALAM batas keras di bawah.
#   * kredit API habis / jaringan putus / balasan sampah -> pakai angka mesin,
#     trading JALAN TERUS. Kalau agent wajib, satu kegagalan API = sleeve mati.
#   * keluaran model tidak deterministik; batas keras membuat kerusakan terparah
#     yang bisa ia sebabkan tetap terbatas dan bisa diaudit.
#
# KONSEKUENSI YANG HARUS DISADARI: begitu agent menggeser SL/TP/exit, angka backtest
# H4-B (PF 1.81, maxDD -14.8%) BERHENTI menggambarkan yang berjalan. Yang jalan jadi
# sistem baru tanpa rekam jejak. Itu sebabnya tiap keputusan dicatat lengkap (angka
# mesin DAN angka agent) supaya belakangan bisa diukur mana yang lebih baik.
# =====================================================================================
smc_rr:
  enabled: true
  model: "claude-sonnet-5"   # 2026-08-13 permintaan user: Sonnet biar murah
  max_tokens: 16000           # lihat catatan max_tokens di blok advisor: web_search
                              #   menghabiskan jatah output lewat thinking + code execution.
                              #   Di 1200 model tidak pernah sampai menulis JSON.
  timeout_seconds: 900        # 2026-08-13 dinaikkan lagi: panggilan NYATA terukur 500
                              #   detik (bukan 170). Di timeout 300 dia akan selalu jatuh
                              #   ke fallback -> agent tidak pernah benar-benar dipakai.
  max_search_uses: 2          # diturunkan dari 4: tiap pencarian menambah waktu DAN token
                              #   (input terukur 71.916 token/panggilan = $0.32). Dua
                              #   pencarian cukup untuk kalender + sentimen.         # panggilan sinkron di loop manager -> WAJIB ada timeout
  web_search: true            # baca kalender ekonomi + berita emas langsung
  timeframes: ["H4", "H1", "M5"]   # 2026-08-13 permintaan user: SL/TP harus dicek di
                              #   BERBAGAI timeframe, dan konfirmasi entry di M5.
                              #   H4 = bias & struktur besar, H1 = zona, M5 = konfirmasi
                              #   entry + likuiditas terdekat yang menentukan SL wajar.
  tv_symbol: "OANDA:XAUUSD"
  allow_skip: false           # false = agent boleh menyesuaikan angka tapi TIDAK boleh
                              #   membatalkan zona. Set true kalau nanti terbukti
                              #   verdict SKIP-nya memang memprediksi trade rugi.
  # ---- batas keras: agent TIDAK bisa melewatinya; dilanggar = angka mesin dipakai ----
  sl_max_mult: 1.5            # SL maksimum 1.5x jarak SL mesin (membatasi risiko)
  min_sl_usd: 3.0             # SL minimum $3 (cegah stop tercekik lalu kena noise)
  rr_min: 1.2                 # RR akhir minimum (cegah TP dipepet jadi tidak layak)
  expiry_min_bars: 3
  expiry_max_bars: 24
  journal_path: "smc_rr_journal.jsonl"

# AI-vision audit trail (used by pipeline/vision/journal.py)
vision:
  journal_path: "vision_journal.jsonl"
  archive_dir: "_DOC/vision"

# SHADOW ADVISOR (pipeline/live/advisor.py) â€” separate read-only process. On each NEW brain
# entry (matched by magic) it captures the chart, asks Claude for a macro/micro CONFIRM/CAUTION
# read, and logs it next to the trade. It NEVER places/blocks/sizes an order â€” pure insight.
# Run via START_ADVISOR.bat. Evaluate later with research/advisor_eval.py.
advisor:
  enabled: true
  poll_seconds: 15              # how often to scan MT5 for a new position (read-only)
  model: "claude-sonnet-5"      # 2026-08-13 permintaan user: pakai Sonnet biar murah.
                                #   Perkiraanku semula (~$1.20/tahun) TERLALU RENDAH: itu
                                #   dihitung tanpa web_search dan tanpa gambar chart, dan
                                #   memakai ~20 zona/tahun padahal hitungan pastinya 119
                                #   (H4 38 + H1 81 — yang dihitung ZONA TER-ARM, bukan yang
                                #   terisi). Dengan Sonnet 5 total ~$25-30/tahun.
                                #   Sonnet 5 mendukung web_search_20260209.
  max_tokens: 16000             # 2026-08-13 dinaikkan dari 1500 setelah uji end-to-end GAGAL.
                                #   web_search_20260209 punya dynamic filtering -> menjalankan
                                #   code execution di belakang layar. Balasannya penuh blok
                                #   thinking + server_tool_use + code_execution_tool_result,
                                #   dan SEMUA itu memakan jatah output. Di max_tokens 1200 dan
                                #   4000 hasilnya NOL blok teks: model kehabisan jatah sebelum
                                #   sempat menulis JSON, dan fallback ke angka mesin.
                                #   Biaya TIDAK naik karena plafon dinaikkan - yang dibayar
                                #   token yang benar-benar dipakai.
  web_search: false             # 2026-08-13 DIMATIKAN untuk hemat token, dan alasannya
                                #   DUPLIKASI YANG TERUKUR - bukan penghematan buta:
                                #   panggilan ber-web_search memakai 71.916 token input,
                                #   padahal gambar chart cuma ~3.200 dan prompt ~1.500.
                                #   Sisanya ~67.000 token (93% biaya) adalah hasil pencarian.
                                #
                                #   Untuk SMC pencarian itu MUBAZIR: agent RR (blok smc_rr
                                #   di bawah) sudah membaca kalender + berita emas tepat
                                #   SEBELUM order dikirim, dan hasilnya tercatat di
                                #   smc_rr_journal.jsonl untuk trade yang SAMA. Advisor
                                #   menyala beberapa detik kemudian dan akan mencari berita
                                #   yang sama persis lagi.
                                #
                                #   Jadi advisor kini murni pembaca CHART (verdict
                                #   CONFIRM/CAUTION di samping hasil trade). Konteks
                                #   beritanya TIDAK hilang - ada di jurnal agent RR.
                                #   Nyalakan lagi HANYA kalau advisor dipakai untuk magic
                                #   yang tidak lewat agent RR.
  max_search_uses: 2            # dipakai hanya kalau web_search dinyalakan lagi
  # Magic yang diberi verdict saat ZONA TER-ARM (pending LIMIT dipasang), bukan saat terisi.
  # Ini permintaan user: "test itu per ada alert zona yang masuk dengan teori SMC".
  # Dua keuntungan nyata dibanding pemicu per-posisi:
  #   1. verdict tercatat SEBELUM fill -> bisa dinilai apakah ia memprediksi hasil
  #   2. order yang KEDALUWARSA tanpa terisi ikut dapat label (16 dari 31 pending di
  #      jendela uji paritas) -> dataset berlabel jadi DUA KALI LIPAT
  watch_pending: [920643]       # smc_xau H4 (mode limit -> punya pending).
                                # 920644 TIDAK di sini: mode m5_confirm tidak
                                # memasang pending, dia dipicu lewat POSISI.
  # Catatan lama (masih berlaku untuk 920644):
                                #   Pemicu ini menyala saat PENDING LIMIT terpasang. Sejak
                                #   smc_xau_h1 pindah ke entry_mode "m5_confirm" dia tidak
                                #   memasang pending sama sekali (langsung MARKET setelah
                                #   BOS M5), dan smc_xau H4 dimatikan. Jadi tidak ada lagi
                                #   pending yang bisa memicunya - membiarkan [920644] di sini
                                #   hanya menyesatkan: kelihatan aktif padahal mati.
                                #   Isi lagi kalau ada slot smclimit ber-entry_mode "limit".
                                #
                                #   PEMBACAAN BERITA/SENTIMEN TIDAK HILANG: itu dikerjakan
                                #   pipeline/live/smc_rr.py (blok `smc_rr` di bawah), yang
                                #   dipanggil SEBELUM order dikirim - tempat yang lebih
                                #   berguna, karena hasil bacaannya masih bisa mengubah
                                #   SL/TP/time-exit. Advisor cuma mengulangnya SETELAH posisi
                                #   terbuka, dengan biaya sama tapi tanpa bisa bertindak.
  timeframes: ["H1", "M5"]      # 2026-08-13 disamakan dengan timeframe sleeve-nya:
                                #   H1 = tempat zona OB dihitung, M5 = tempat konfirmasi
                                #   entry terjadi. H4 dibuang karena aliran H4 sudah mati.
                                #   Tiap gambar ~1.600 token.
  prompt_file: "pipeline/vision/prompt_advisor.md"
  journal_path: "advisor_journal.jsonl"
  archive_dir: "_DOC/advisor"
  # which live magics to watch -> canonical symbol + its TradingView feed for capture
  # 2026-08-13 DIPERSEMPIT ke SMC saja atas permintaan user (hemat token).
  # ORB dikeluarkan justru karena dia yang PALING SERING trade (~1 tiap hari kerja)
  # sementara nilai anotasinya paling kecil - dia sudah punya time-exit sendiri.
  # eterna dan slot arsip (920622/920624/920625/920626/920643) juga dikeluarkan.
  # Menambah lagi: cukup tulis barisnya di sini, tidak ada perubahan kode.
  watch:
    - {magic: 920644, symbol: XAUUSD, tv_symbol: "OANDA:XAUUSD"}      # smc_xau_h1 (dipicu POSISI)
    - {magic: 920643, symbol: XAUUSD, tv_symbol: "OANDA:XAUUSD"}      # smc_xau H4 (dipicu ZONA)


# MONTHLY PROFIT GOVERNOR (pipeline/live/monthly_governor.py) â€” the 'bersyukur' rule. Once month-to-
# date realized PnL for the book reaches threshold x the month's forecast target, PAUSE new entries
# for the rest of the month (open positions ride). Resets on the 1st. Writes _MONITOR/governor.json,
# read by the brain (Z+Golden) and the ORB manager. Run via START_GOVERNOR.bat.
governor:
  enabled: true
  mode: rules                         # 2026-07-12 FBS-Demo forward-test: keep RULES path active (exercises the fixed cap)
  magics: [920617, 920622, 920626]   # HANYA untuk _book_conflict di signal.py (cegah dua
                                     #   sleeve searah di simbol sama). JANGAN tambahkan
                                     #   eterna/SMC ke sini - mereka memang dirancang
                                     #   independen, dan memblokir mereka mengulang
                                     #   kesalahan ZREV (-$1.526 entry eterna hilang).
  # 2026-08-14: akuntansi PnL + flatten memakai daftar TERPISAH ini. Sebelumnya governor
  # hanya menghitung ORB, jadi rem harian buta terhadap 3/4 buku.
  pnl_magics: [920617, 920627, 920643, 920644]   # ORB + ETERNA + SMC H4 + SMC H1
  # --- demo-safe numbers (FBS-Demo 106271896, ~$287). Floor/daily LOOSE so they don't nuisance-trip a forward test;
  #     the per-trade risk cap stays $90 (harmless at 0.01 lot, but blocks any absurdly-wide stop). All values are
  #     read live from governor.json; if that file is missing, signal.py now FAILS CLOSED to max_risk_per_trade here. ---
  max_risk_per_trade: 90             # skip any entry whose $ risk (|entry-sl|*lot*contract) exceeds this
  daily_loss_usd: 250                # loose on demo (won't stop a normal forward-test day)
  daily_stop_buffer: 0
  maxloss_floor: 50                  # only flatten if the demo is nearly wiped (equity -> $50+buffer)
  maxloss_buffer: 0
  poll_seconds: 60
  # --- profit ('bersyukur') mode fields, unused when mode=rules ---
  threshold: 0.75
  target_usd: null

audit:
  interval_minutes: 15       # continuous worker re-check cadence
  enable_repair: true        # auto-repair gaps/anomalies (false = report only)
  refetch_before_fill: false # re-fetch medium gaps from source first (slow; useful for flaky sources)
  max_refetch_days: 60       # cap on days re-fetched per symbol per cycle
  max_fill_gap_minutes: 5    # intraday gaps <= this may be forward-filled (synthetic)
  spike_return_threshold: 0.10   # |1m return| above this is flagged as a spike
  flatline_repair: false     # flatline bars are reported, not repaired
  report_dir: "_DOC/audit"
  gaps_dir: "data/Level_2_Datamart/audit"
