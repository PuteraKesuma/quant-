        rule_bias_timeframe: "H1"
        rule_bias_swing_length: 10
        rule_history_bars: 20000
        max_trades_per_day: 2
        interval_minutes: 5
        min_confidence: 65
        min_rr: 2.0
        model: "claude-sonnet-4-6"
        max_tokens: 1024
        prompt_file: "pipeline/vision/prompt_smc_mtf_v2.md"
        capture_mode: "mt5"
        timeframes: ["H4", "M15", "M5"]
        chart_bars: 200

    - name: smc_gbpusd
      enabled: false          # DISABLED 2026-08-18 by user choice: weakest of the four pairs
                              #   (WR59.3% avgR+0.59, weakens further in 2nd half +0.93->+0.28).
                              #   Params/tuning kept here (reversible: set true), not deleted.
      type: vision
      symbol: GBPUSD
      lot: 0.01
      magic: 920642
      params:
        rule_gate: true
        rule_timeframe: "M5"
        rule_swing_length: 2        # 2026-08-18: n=27/196d WR59.3% avgR+0.59, both halves positive (+0.93/+0.28) -- weakest WR of the four but still solid
        rule_bias_timeframe: "H1"
        rule_bias_swing_length: 10
        rule_history_bars: 20000
        max_trades_per_day: 2
        interval_minutes: 5
        min_confidence: 65
        min_rr: 2.0
        model: "claude-sonnet-4-6"
        max_tokens: 1024
        prompt_file: "pipeline/vision/prompt_smc_mtf_v2.md"
        capture_mode: "mt5"
        timeframes: ["H4", "M15", "M5"]
        chart_bars: 200

    # DISABLED 2026-08-18 -- same two reasons as smc_xau above (unreachable confidence gate +
    # the rule's edge was an artifact of two lookahead leaks). USDJPY was the stronger pair on
    # the leaky harness (0.49 cand/wk, WR 44%, +8R); on the leak-free one it is 13.33 cand/wk,
    # WR 15.4%, avgR -0.539, -372R, negative in BOTH halves. Kept, not deleted.
    - name: smc_usdjpy
      enabled: false
      type: vision
      symbol: USDJPY
      lot: 0.01
      magic: 920643
      params:
        rule_gate: true
