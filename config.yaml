orb:
  range_minutes: 30        # Opening range duration
  tp_multiplier: 1.0       # TP = range_size * multiplier
  sl_multiplier: 1.0       # SL = range_size * multiplier
  max_trades_per_session: 1
  entry_buffer_pips: 0     # Buffer above/below range high/low

walk_forward:
  in_sample_months: 6
  out_sample_months: 2
  step_months: 2
  min_trades: 30           # Minimum trades per window to be valid

live:
  host: "127.0.0.1"
  port: 8000
  data_source: mt5           # source of live bars for signal evaluation
  recent_bars: 600           # M1 bars pulled per evaluation (covers the NY ORB window)
  # MT5 returns bar times in BROKER SERVER time, not UTC. We shift them to true
  # UTC so the session windows (13:30 UTC NY etc.) line up with the research.
  # FBS = UTC+3 in summer (DST), UTC+2 in winter. null = auto-detect from a fresh
  # tick; set an integer to force it. Server warns if the live offset differs.
  mt5_server_utc_offset_hours: null
  poll_seconds: 1            # EA poll cadence (used to judge EA "connected" in heartbeat)
  heartbeat_seconds: 15      # server logs a heartbeat line at this cadence
  # Each entry is one independent strategy "slot". Multiple slots (even on the
  # same symbol) run concurrently and hold separate positions, tagged by `magic`.
  # `type` picks the engine (dummy | orb | <future model>); the EA never changes.
  # Give every slot a UNIQUE magic so positions never collide.
  strategies:
    - name: orb30_nas        # NAS100 â€” REPRODUCED 2026-06-28 (full live logic, M1 fill):
                             #   OOS PF 1.40, IS 1.28, 6/6 thn hijau, MC 5th-pct 1.04, 0% order invalid.
                             #   Edge nyata tapi TIPIS (exp ~0.08R). Klaim lama "1.52" sedikit optimis.
      enabled: false         # 2026-07-04: EA market-slot OFF. The orb_stop_manager (brain-side) owns a
                             #   REAL pending STOP at the range boundary for magic 920617 -> reclaims the
                             #   +4.75..+16.30 pt entry slippage the market EA gave (signal_logic_audit.py).
                             #   Faithful port of THIS slot's logic (same trades), EA untouched + still OUT
                             #   of its own breakeven (BreakevenMagics=920621). See pipeline/live/orb_stop_manager.py.
      type: orb
      symbol: NAS100
      session: new_york      # cash open; dst_open shifts it 13:30 (summer) / 14:30 (winter) UTC
      lot: 0.01              # 2026-07-12 FBS-Demo $287: US100 0.01 = $0.10/pt (WMT was 0.2 NQ100x)
      magic: 920617          # manager owns it now (EA gets no NAS100 signal -> leaves it alone)
      params:
        range_minutes: 30    # NY 30-min opening range
        tp_mult: 1.0         # TP = 1 x range   (RR 1:1)
        sl_mult: 1.0         # SL = 1 x range
        use_sl: true         # real stop (RR 1:1 needs it)
        dst_open: true       # FIX: NAS cash open moves with US DST; fixed 13:30 was wrong half the year
        trend_sma: 50        # EDGE: only trade breakouts WITH the daily SMA50 trend (lifts OOS 1.02->1.35)
        breakeven_r: 0.5     # DYNAMIC EXIT: once +0.5R, exit at entry on retrace (OOS 1.33->1.52, DD down, WF 11/11)
        range_filter: false  # dropped: trend filter already does the heavy lifting; RF added ~nothing
        session_end_utc: "20:00"  # time-exit if neither SL/TP hit
        # --- orb_stop_manager: REAL pending STOP at the range boundary (via MT5, EA untouched) ---
        pending_stop: true        # marks this slot for the standalone STOP manager (main() picks it up)
        manager_poll_seconds: 10  # poll cadence (place the stop promptly at range_end; manage BE/exit)
        dry_run: false            # 2026-07-04 LIVE on demo: places REAL pending STOP orders. (true = log-only.)

    - name: liquidity_limit_strategy   # Liquidity Limit â€” Supertrend band 'limit' entries (BOTH sides)
      enabled: false        # RETIRED 2026-07-08: weakest edge (PF 1.33, 2022 negative) and the main
                            #   bleeder in the gold downtrend. User simplified to ONE strategy per
                            #   commodity: Z=XAU, ORB=NQ. liquidity_manager process STOPPED, its pending
                            #   order cancelled, watchdog relaunch removed, startup shortcut archived.
                            #   To revive: re-add watchdog LiqMgr block + START_LIQMGR startup shortcut.
      type: liqlimit        #   See pipeline/live/liquidity_manager.py. Claude confirms fills via advisor.
      symbol: XAUUSD
      lot: 0.01
      magic: 920625         # UNIQUE (920617=US100, 920622/920624=Z archived, 920621=vision, 920623=mr)
      params:
        timeframe: "15min"  # 2026-07-03: match developer's chart TF (was 1h -> band too far below, missed fills)
        st_period: 21       # Wilder ATR period
        st_mult: 5.5        # band = src -/+ 5.5*ATR (the supertrend support/resistance 'limit')
        tp_dollars: 26.0    # TP = band +/- $26  (broker-matched: XAU 0.01 lot -> $1 per $1 move)
        sl_dollars: 13.0    # SL = band -/+ $13  (2.4x ATR; tradeable = 3.7% of $349)
        both_sides: true    # BUY in uptrend (pullback to support) + SELL in downtrend (bounce to resistance)
        history_bars: 15000 # ~250 1H bars (plenty for ATR21 supertrend warmup)
        # --- liquidity_manager: REAL pending LIMIT order at the band (via MT5, EA untouched) ---
        dry_run: false      # 2026-07-03 LIVE on demo: places REAL pending limit orders. (true = log-only.)
        manager_poll_seconds: 10  # re-price cadence (the limit follows the band)
        min_reprice_move: 0.3     # only MODIFY the resting limit if the band moved > this ($)

    # DISABLED 2026-06-27 (lean-down): XAU-NY ORB berkorelasi dgn Z (dua-duanya gold) -> menambah
    # drawdown (DD -$270 -> -$427 saat aktif) dgn tambahan return tipis. Gold cukup Z + vision.
    # Uncomment utk mengaktifkan lagi. (magic 920618)
    # - name: orb30_xau
    #   type: orb
    #   symbol: XAUUSD
    #   session: new_york
    #   lot: 0.01
    #   magic: 920618
    #   params:
    #     range_minutes: 30
    #     tp_mult: 3.0
    #     sl_mult: 1.0
    #     use_sl: true
    #     session_end_utc: "20:00"

    - name: zrev_xau        # Z Strategy: PURE always-in Donchian stop-and-reverse XAUUSD 1H
      enabled: false        # OFF 2026-08-06: dimatikan user saat rebuild VPS (menuju strategi 'eterna').
                            #   Reversible: set true + restart brain. Riwayat alasan lama di bawah.
                            # RE-ENABLED 2026-07-03: portfolio study (research/portfolio_best.py) â€” the
                            #   FULL book Z+NAS+LIQ (OOS-PF 1.87, net +$4685) needs its main engine back;
                            #   NAS+LIQ alone was the weakest combo (OOS 1.56, negative 2022). User chose FULL.
      type: zrev            #   2026-06-29 audit (entry20/exit20 = always-in): IS PF 1.09, OOS 1.58,
                            #   MC 5th-pct 1.18, 5/6 thn hijau, 0% order invalid. ~4 trade/minggu,
                            #   hold ~1 hari, SELALU ada posisi (flip ~tiap 1.8 hari). maxDD -$501 @0.01
                            #   lot -> under-capitalized di $400 demo; real money butuh ~$1500+.
      symbol: XAUUSD
      lot: 0.01             # 2026-07-12 FBS-Demo $287: base 0.01 (WMT was 0.02-0.04); capital-cap holds it at 0.01
      magic: 920622         # UNIQUE (920617=US100, 920618=orb_xau, 920620=orb_xau_asia lama, 920621=vision)
      params:
        entry_n: 20         # entry channel = breakout 20 jam (Donchian)
        exit_n: 20          # exit = entry -> S&R; dgn trend_filter -> flat saat lawan tren (bukan reverse)
        use_sl: true        # broker SL backstop = level channel lawan (proteksi kalau server mati)
        trend_filter: true  # filter tren EMA H1 -> skip whipsaw chop
        trend_ema: 100      # hanya long saat close>EMA100, hanya short saat close<EMA100
        daily_filter: true  # 2026-06-29: gate tren HARIAN (multi-TF align) -> DD -$406->-$313 (-23%),
        daily_sma: 50       #   PF 1.33->1.63, OOS 2.19, MC 1.41. Cuma trade kalau H1 + harian sepakat.
        adx_min: 28         # 2026-07-17 GATE KE-3 = KEKUATAN tren (bukan arah). Cuma entry kalau ADX
        adx_period: 14      #   harian (bar selesai, no-lookahead) >= 28 -> Z duduk diam saat emas chop.
                            #   research/regime_fix.py + final_1000.py, equity path-dependent dari $1000:
                            #   gate 0 (setelan lama) -> maxDD -62%, 5/6 thn hijau, Sharpe 1.58
                            #   gate 28 (ini)         -> maxDD -19%, 6/6 thn hijau, Sharpe 1.45
                            #   HARGANYA JUJUR: Z 549 -> 187 trade, profit backtest $41k -> $9.6k @ $1000.
                            #   Dipilih utk DD TERENDAH + satu-satunya 6/6 hijau (user: "bisa bertahan"),
                            #   BUKAN utk profit maksimum (gate 18 lebih cuan tapi 2021 merah -$31).
                            #   Catatan: di gate 28 Z cuma untung saat emas trending (2024-26); ORB +
                            #   Reversal yang bikin 2021-2023 hijau. Jangan matikan mereka.
        dynamic_lot: true   # 2026-06-29 TEST: lot ikut momentum entry (z-score). Validasi: net +37%,
        lot_min: 0.01       #   2026-07-12 FBS-Demo: 0.01-0.02 dynamic; capital-cap (lot_per_balance) pins 0.01 at $287.
        lot_max: 0.02       #   risk cap ($90) now FAIL-CLOSED to config even if governor.json is missing.
        lot_z_lo: 0.5       # 2026-07-08 PLAYBOOK RULE #3 (research/z_momentum_sizing.py, walk-forward):
        lot_z_hi: 1.0       #   size 0.02 at entry-momentum z_dir>=1 (was z_hi 3.0 = only at z>=2).
                            #   Sharpe 1.20->1.26, net +27%, OOS 2.48->2.34, same 0.02 cap/tail. 0.03
                            #   rejected (tail -$408, Sharpe barely better). NOTE: lot_per_balance below
                            #   keeps Z at 0.01 until ~$1500+ balance, so NO change at $260 (safety);
                            #   the momentum tilt only arms as the account grows. Z loss -$136@0.01 ->
                            #   -$272@0.02, which a small account cannot survive -> the cap is mandatory.
        lot_per_balance: 0.0000067 # 2026-07-01 KONSERVATIF: cap = balance*0.0000067 (~0.01/$1500).
                            #   $387->0.01 (fixed), tetap 0.01 s/d ~$1500, baru naik ke plafon 0.02 di ~$3000.
                            #   MC: DD terburuk 5thn ~-28%, risk-of-ruin ~0%. Survival jangka panjang.
        atr_stop_mult: 3.0  # 2026-06-30 TEST: broker SL backstop lebih ketat = entry +/- 3*ATR
                            #   (audit: PF 2.19->2.23, DD -$314->-$301, MC ->1.46; SL lebih dekat dari channel)
        history_bars: 15000 # ~250 jam = ~250 bar 1H (cukup utk EMA100+channel; kecil biar /signals cepat)

    - name: zrev_xau_4h     # Gold edge KEDUA: zrev di TF 4H (tangkap tren besar/lambat)
      enabled: false        # ARCHIVED 2026-07-03 by user choice (reversible: set true + restart brain).
      type: zrev            #   2026-06-30 audit (xau_diversify.py): OOS PF 3.59, MC 1.71, net +$2500,
      symbol: XAUUSD        #   ~0.5 trade/mgg. Korelasi 0.84 ke 1H (bukan pengurangan risiko, aliran ke-2).
      lot: 0.01             # FIXED 0.01 (no dynamic lot) - jaga margin di exposure gold dobel
      magic: 920624         # UNIQUE (920622=zrev 1H, 920621=vision, 920617=US100)
      params:
        timeframe: "4h"     # channel/EMA dihitung di bar 4 jam
        entry_n: 20
        exit_n: 20
        use_sl: true
        trend_filter: true
        trend_ema: 50       # EMA50 di 4H (~8 hari) - cocok dgn backtest PF 3.59
        daily_filter: true
        daily_sma: 50
        history_bars: 15000 # ~250 jam = ~62 bar 4H (cukup utk EMA50+channel; kecil biar /signals cepat)

    - name: golden_xau      # Golden Strategy 1 â€” rehabilitated Semi-Marti EA signal (martingale stripped)
      enabled: false        # DISABLED 2026-07-17 (research/golden_check.py + book_1000_full.py) â€” ARTIFACT,
                            #   bukan edge. Sama kelasnya dengan mr_xau. Semua riset Golden (semi_marti_*.py,
                            #   regime_adaptive.py, regime_sizing.py) me-reindex gate H1 ke M5 dengan ffill
                            #   TANPA shift: `adx(h1).reindex(idx5, method="ffill")` dan `t15 = np.sign(...)
                            #   .reindex(idx5, method="ffill")`. resample("1h") berlabel AWAL bar, jadi bar
                            #   10:00 (isi data s/d 10:59) sudah kepakai di M5 10:05 => LOOKAHEAD s/d 55 menit
                            #   pada trend-gate + ADX-gate. ATR M5 di file yang sama di-.shift(1) (benar) â€”
                            #   gate H1-nya yang kelewat. Padahal sinyal mentahnya RUGI; dua gate itulah
                            #   seluruh "edge" => edge = lookahead-nya.
                            #   Setelah gate di-shift +1h (jujur): PF 2.14 -> 1.04, WR 26%, 6/6 -> 3/6 hijau
                            #   (2021/2022/2026 RED), net +$341 / 1259 trade = +$0.27/trade = lempar koin.
                            #   Portfolio $1000: Golden ON melipatgandakan maxDD -19% -> -39% dan merusak
                            #   robustness 6/6 -> 4/6 (Sharpe 1.45 -> 1.28) demi +$361. Opposite-guard TIDAK
                            #   menolong (DD tetap -39%; cuma 24 dari 1259 entry yang bentrok arah dgn Z).
                            #   Konsisten dgn live: 2026-07-17 Golden long 0.02 vs Z short -> SL -$45.36,
                            #   dan 2026 = tahun TERBURUK Golden di backtest jujur (-$312, DD -$988).
                            #   regime_sizing.py punya bug yang sama => aturan lot_favorable 0.02 (klaim
                            #   "+40% net") juga fiktif. JANGAN diaktifkan sebelum riset di-rerun dgn gate
                            #   H1 di-shift dan hasilnya terbukti positif secara mandiri.
      type: golden
      symbol: XAUUSD
      lot: 0.01             # 2026-07-12 FBS-Demo $287: base 0.01 (regime-sized to 0.02 in favorable low-ADX)
      magic: 920626         # UNIQUE (920617=NQ ORB, 920622=Z, 920624=zrev4h archived, 920625=LIQ retired)
      params:
        timeframe: "5min"   # signal TF (normalized MACD + price over norm bars)
        trend_tf: "1h"      # trend/ADX timeframe
        norm_period: 100    # min-max normalization window
        level_low: 15       # both norms <= this -> oversold BUY (with uptrend)
        level_high: 80      # both norms >= this -> overbought SELL (with downtrend)
        macd_fast: 5
        macd_slow: 13
        macd_signal: 9
        ema_trend: 15       # H1 EMA whose slope = the trend gate (FAST = the validated lever)
        adx_period: 14
        adx_max: 40         # skip entries when H1 ADX > this (over-extended trend, no edge either way)
        atr_period: 14
        atr_mult: 3.0       # SL = 3 x ATR(M5)
        tp_r: 3.0           # TP = 3 x risk (let winners run WITH the trend)
        # --- regime-based sizing (validated playbook rule, research/regime_sizing.py) ---
        regime_sizing: true # size up in the favorable low-ADX regime (Golden's best bin)
        size_adx_thresh: 20 # H1 ADX < this -> favorable regime
        lot_favorable: 0.02 # 2026-07-12 FBS-Demo: 0.02 in favorable low-ADX regime (base 0.01) = validated demo ratio.
                            #   Risk-capped $90/trade (fail-closed). WMT used 0.04/0.02.
        history_bars: 15000 # ~250h M1 -> plenty for M5 norm(100) + H1 EMA15/ADX14

    # (2026-07-09 dummy_wmt EA-loop test PASSED â€” brain->EA->WMT execution proven; slot removed.)

    # DISABLED 2026-06-28 (audit) â€” ARTIFACT, bukan edge. magic 920623.
    # Re-audit (research/audit_live_strategies.py, _DOC/audit_2026-06-28.md) menemukan:
    # entry_z 2.5 < stop_z 3.0 berarti SETIAP sinyal dengan |z| >= 3.0 punya SL di sisi
    # SALAH dari entry (BUY: SL >= entry; SELL: SL <= entry) -> order DITOLAK broker live.
    # 54% sinyal seperti ini. Validator lama (mr_validate.py/m1_validate.py, tak pernah
    # di-commit) membukukan `stop-entry` sebagai PROFIT untuk order tak-fillable itu ->
    # PF palsu OOS 2.74. Setelah order invalid dibuang + fill M1 jujur (SL sebelum TP):
    # OOS PF 0.72, WR 10%, 1/6 tahun hijau, MC 5th-pct 0.48 = RUGI. JANGAN diaktifkan.
