        rule_swing_length: 1        # 2026-08-18 re-tune for frequency: n=42/196d (1.50/wk) WR83.3% avgR+0.84,
                                     #   both halves positive (+1.00/+0.69). Also checked M1 swing1/2/3 (0.68-1.50/wk,
                                     #   WR76-90%) -- M5 swing1 has the best quality of everything tested for this
                                     #   pair (highest avgR, strengthens 2nd half) at near-equal frequency, so kept
                                     #   M5. NOTE: a first M1 check on a 48-day slice showed 3-4x/wk, but the full
                                     #   196-day window came back at 0.89-1.50/wk -- that short window was an
                                     #   outlier, not the real rate; don't re-trust a <2mo sample for this pair again.
        rule_bias_timeframe: "H1"
        rule_bias_swing_length: 10
        rule_history_bars: 20000
        max_trades_per_day: 2
        interval_minutes: 5
        min_confidence: 65
        min_rr: 2.0
        model: "claude-sonnet-4-6"
        max_tokens: 1024
        prompt_file: "pipeline/vision/prompt_smc_mtf_v2.md"
