    # =================================================================================
    # ETERNA â€” dual-Supertrend XAU H1, SATU set parameter (magic 920627).
    # Diturunkan dari EA pihak ketiga 'EA EternaBot V.2' (TikTok @reeztradefx), TAPI
    # hampir SEMUA default EA-nya DIBALIK, karena riset kami (research/eterna_*.py,
    # 20 fase, ~1900 konfigurasi di XAUUSD 1m 5,5 tahun) membuktikan default-nya rugi:
    #   - martingale MATI  : "akurasi" EA itu ilusi martingale (identik temuan
    #                        research/semi_marti_signal.py, commit 62ea652)
    #   - H1, bukan M1/M5  : EA menyarankan scalping; M5 rugi -$21.700, 97% bulan merah
    #   - gate KONSERVATIF : entry hanya searah Supertrend tren. Menang 5/5 jendela
    #                        walk-forward sementara angka parameternya berubah 4/5
    #                        -> edge-nya STRUKTURAL, bukan di angkanya
    #   - TANPA trailing / breakeven / partial TP / buffer SL / filter jam
    #                        (semua varian struktural yang diuji memperburuk Ret/DD)
    #
    # SL = ekstrem `struct_bars` bar TERTUTUP. EA mengikat lookback ini ke ATR_Period
    # (EA baris 259: `int bars = (int)ATR_Period;`) -> struct_bars = atr_period.
    # CATATAN: versi awal slot ini keliru memakai struct_bars 20 tetap; itu membuat SL
    # 2-3x lebih lebar dari maksud EA dan menaikkan maxDD dari 14% ke 28%. Sudah dikoreksi.
    #
    # atr_period 16 dipilih karena ada di TENGAH plateau (10..24 semuanya sehat), bukan
    # karena angkanya paling tinggi. Pusat dataran lebih dipercaya daripada puncaknya.
    #
    # Tervalidasi @modal $1000 lot 0.01 biaya $0.50 (research/eterna_revalidate.py):
    #   5,5 tahun : net $2790, PF 1.57, maxDD -14,1%, 51%/thn, Ret/DD 3.63, 6/6 thn hijau
    #   2026 YTD  : net +$2159 (+216%), PF 2.69, maxDD -12,6%, WR 47%
    #
    # ---- YANG WAJIB DIKETAHUI OPERATOR (research/eterna_concentration.py) ----
    # * Profit SANGAT terkonsentrasi: 10 trade terbaik (1,7%) = 85% seluruh profit.
    #   Trade MEDIAN RUGI $4,67 dan win-rate cuma 37%. Melewatkan 5 trade terbaik saja
    #   menghapus 58% profit. SLOT INI HARUS DIBIARKAN JALAN, termasuk di bulan datar.
    # * Bulanan TIDAK rata dan TIDAK BISA diratakan: menurunkan TP ke 1:1 memang
    #   memuluskan kurva tapi memangkas net 70% DAN tidak menaikkan porsi bulan hijau
    #   (44% vs 53%). Jangan tukar profit demi grafik yang terlihat tenang.
    # * ~47% bulan merah; merah beruntun terpanjang 5 bulan.
    # * 91% profit backtest dari 2024-2026 (emas trending). Block-bootstrap di regime
    #   datar 2021-2023: P(rugi) 33,6% -> saat emas datar dia BERTAHAN HIDUP, bukan
    #   menghasilkan. JANGAN harapkan profit tiap bulan.
    # * Satu trade pernah mempertaruhkan 33% akun $1000 (median 5,6%). SL struktur
    #   melebar saat volatilitas naik dan 0.01 adalah lot minimum, jadi satu-satunya
    #   kendali di akun kecil adalah MELEWATI trade itu -> governor.max_risk_per_trade.
    # =================================================================================
    # 2026-08-18: dummy_test (XAUUSD, magic 999900) + dummy_test_jpy (USDJPY, magic 999901)
    # ran here briefly to verify brain->EA->execution after the EA auto-detect fix + reattach.
    # Both confirmed: real orders placed and auto-closed on the FLAT->BUY->FLAT->SELL cycle
    # (XAUUSD tickets 1972310221/1972315470, USDJPY ticket 1972315500, all opened then closed
    # cleanly within their 1-minute phase). Removed after confirmation -- see git history/
    # jurnal.md for the full log if this needs re-running after a future EA change.

    - name: eterna_xau
      enabled: true         # 2026-08-07 SHADOW: shadow-check lolos (feed FBS vs Dukascopy
                            #   sepakat 99,7%, korelasi 0.999973, offset server +3h benar).
                            #   EA BELUM di-attach ke chart -> brain menghitung, tak ada
                            #   yang mengeksekusi. Attach EA hanya setelah beberapa hari
                            #   sinyal live terlihat wajar.
      type: eterna
      symbol: XAUUSD
      lot: 0.01
      magic: 920627         # UNIK (920617=NQ ORB, 920622=Z, 920626=Golden, 920633=Reversal)
      params:
        timeframe: "1h"
        atr_period: 16      # ATR Supertrend; juga jadi lookback struktur SL (seperti EA)
        mult_entry: 1.8     # Supertrend entry. CATATAN: ini SPIKE, bukan plateau â€”
                            #   tetangganya (1.6 -> Ret/DD 1.75, 2.0 -> 1.95) jauh lebih
                            #   buruk. Satu-satunya parameter yang belum bisa dijelaskan
                            #   kenapa istimewa; perlakukan sebagai titik lemah riset ini.
        mult_trend: 3.8     # Supertrend gate tren -> inilah "mode konservatif"-nya
        tp_ratio: 4.0       # TP = 4 x jarak SL. Plateau 1:3..1:5 semuanya sehat.
        min_sl_dist: 0.30   # tolak SL < $0.30 (bar terlalu sempit)
        history_bars: 30000 # ~500 bar H1 dari M1
    # vision_smc_xau: RETIRED 2026-07-01. LLM-as-decision-maker (entry gate via confidence)
    # is UNVERIFIABLE by construction (no reproducible historical signal series -> can't be
    # backtested), and in practice it just sat FLAT (conf 30-40 < gate 65) -> ~zero trades.
    # REPLACED by the SHADOW ADVISOR (see `advisor:` block below + pipeline/live/advisor.py):
    # LLM no longer DECIDES â€” it captures the chart + macro/micro context at each REAL brain
    # entry and logs a CONFIRM/CAUTION verdict ALONGSIDE the outcome, blocking nothing. After
    # 1-2 months we measure whether "caution" predicts losers -> only THEN earn the right to
    # let it filter. Honest forward-test, zero risk to the validated edge.

    # DISABLED 2026-08-18. Two independent reasons, both measured, neither fixable by tuning:
    #  1. UNREACHABLE GATE. min_confidence 65 was set to "match the prompt", never derived from
    #     data. Claude's confidence on rule-flagged candidates runs 32-52 (mean 38): 0 of 71
    #     candidates over a FULL YEAR would have passed, and the live journal agrees (smc_xau
    #     fired 6 Claude calls on 2026-08-18, all FLAT, conf 40-45). The slot could never trade.
    #  2. THE RULE ITSELF HAS NO EDGE. The walk-forward that justified enabling this slot came
    #     from a harness with two lookahead leaks: the OB/FVG window searched b+30 bars INTO THE
    #     FUTURE, and "unmitigated" meant "never mitigated in all of history" (i.e. it selected
    #     setups by what price did next). Removed both (scratchpad/smc_rule_honest.py) and the
    #     rule goes from 0.74 cand/wk @ -2.0R total to 18.87 cand/wk @ WR 14.3%, avgR -0.571,
    #     -560R. Negative EITHER WAY. This confirms prompt_smc_mtf_v2.md's own header note:
    #     "belum tervalidasi profit. Versi mekanis pola ini tidak ber-edge di backtest."
    # Kept (not deleted) per project convention. Re-enabling requires a rule variant with a
    # demonstrated edge on the LEAK-FREE harness FIRST -- an LLM filter cannot rescue a base
    # that yields ~19 candidates/week at 14% WR.
    - name: smc_xau          # 2026-08-17 NEW ATTEMPT, fixes vision_smc_xau's core flaw:
      enabled: false          #   a RULE-BASED gate (pipeline/live/smc_rules.py, smartmoneyconcepts
                              #   package) decides WHEN to even ask Claude -- sweep -> CHoCH ->
                              #   unmitigated OB/FVG must mechanically fire first (see
                              #   pipeline/vision/prompt_smc_mtf_v2.md for the exact 3-part pattern).
                              #   That "when do we ask" decision is a pure function of OHLC, so it
                              #   IS backtestable/replayable, unlike the old timer-polled version.
                              #   Claude only ever confirms/vetoes a setup a rule-based SMC scan
                              #   already flagged -- never invents one from a blank chart on a timer.
                              #
                              #   FREQUENCY/EDGE TUNING (2026-08-18, walk-forward, 6.5mo XAUUSD M5):
                              #   First pass used sweep_lookback=10 bars and found almost nothing
                              #   (1-3 trades/6.5mo) -- WRONG: a CHoCH's causally-related liquidity
                              #   sweep is typically 20-90 bars before it (confirmation lag stacks
                              #   with real displacement time), so a 10-bar window silently discarded
                              #   most genuine setups. Corrected to sweep_lookback=60/ob_fvg_lookback=30
                              #   (pipeline/live/smc_rules.py) after checking 10/20/30/50/80/100/150/200
                              #   -- win rate holds (66-80%) through ~100 bars then decays (150->56%,
                              #   200->45% as the matched "sweep" stops being causally related). Then
                              #   Swept rule_swing_length in {4,5,6,8} with a walk-forward split (first
                              #   half vs second half): all positive/consistent but only ~0.24 trades/day
                              #   AGGREGATE across all 4 smc_* symbols -- user pushed back ("opportunity
                              #   ada tiap hari", wants 3-4x/week keeping just these 4 symbols, not more
                              #   pairs). Checked rule_bias_timeframe Y-vs-N at every swing value: bias
                              #   NEVER excluded a single candidate in this whole window -- it wasn't the
                              #   constraint. swing_length WAS: re-swept down to {2,3} and found swing=2
                              #   across all 4 symbols -> 3.82 trades/week aggregate (hits the ask), still
                              #   positive in BOTH halves for every symbol (XAUUSD weakest: WR66.7%
                              #   avgR+0.38, 2nd-half only +0.09 but not negative). This is the most
                              #   sensitive value tested -- near the frontier, not deep safety margin.
                              #   Enable only after observing rule-candidate frequency + a few Claude
                              #   verdicts in shadow (no EA attached) look sane.
      type: vision
      symbol: XAUUSD
      lot: 0.01
      magic: 920640           # NEW (outside 920617-920633 range in use elsewhere in this file)
      params:
        rule_gate: true
        rule_timeframe: "M5"        # entry-trigger TF for the mechanical sweep/CHoCH/OB scan
        rule_swing_length: 2        # 2026-08-18 re-tuned for frequency: swing2 all 4 symbols -> 3.82 trades/week
                                     #   AGGREGATE (user's ask: "3-4x seminggu"), XAUUSD alone n=21/196d
                                     #   WR66.7% avgR+0.38 (1st-half +0.70/n10, 2nd-half +0.09/n11 -- still
                                     #   positive but the weakest pair at this setting). This is the most
                                     #   sensitive value tested (2,3,4,5,6,8) -- near the frontier, not deep
                                     #   in a safety margin. rule_bias_timeframe checked Y vs N across every
                                     #   swing value: IDENTICAL results every time (H1 bias never actually
                                     #   excluded a candidate in this whole 6.5mo window) -- kept anyway since
                                     #   it's free and may matter in a differently-trending period; it is NOT
                                     #   what was limiting frequency.
        rule_bias_timeframe: "H1"   # "market confidence" cross-check -- empty string = off
        rule_bias_swing_length: 10
        rule_history_bars: 20000    # M1 bars pulled -> resampled to rule_timeframe/rule_bias_timeframe
        max_trades_per_day: 2       # safety ceiling; real A+ setups run ~0.75/week on this one symbol at swing2
        interval_minutes: 5         # cheap rule-check cadence; Claude itself only called on a NEW candidate
        min_confidence: 65          # matches prompt_smc_mtf_v2.md's own confidence guard
        min_rr: 2.0                 # matches prompt_smc_mtf_v2.md's own R:R >= 2 requirement
        model: "claude-sonnet-4-6"
        max_tokens: 1024
        prompt_file: "pipeline/vision/prompt_smc_mtf_v2.md"
        capture_mode: "mt5"         # mplfinance-rendered charts (no browser dependency for v1)
        timeframes: ["H4", "M15", "M5"]   # macro bias -> entry trigger, highest to lowest (Claude's own read)
        chart_bars: 200

    # 2026-08-18: same smc_xau architecture, extended to majors -- walk-forward tested
    # per pair (6.5mo M5, first-half/second-half split, sweep_lookback=60/ob_fvg_lookback=30
    # after the XAUUSD window-size fix -- see smc_xau's comment above for that story).
    # rule_swing_length=2 for all 4 symbols (2026-08-18 re-tune, see smc_xau's comment) --
    # 3.82 trades/week aggregate, positive both walk-forward halves for every symbol.
    - name: smc_eurusd
      enabled: false          # DISABLED 2026-08-18 by user choice: weaker than smc_usdjpy
                              #   (WR67.6% avgR+0.72 vs USDJPY's WR84.0% avgR+1.18). Params/tuning
                              #   kept here (reversible: set true) rather than deleted, matching
                              #   how every other retired slot in this file is handled.
      type: vision
